name: API regression tests
on:
  push:
    branches:
      - feature/guided-journey-mvp
  pull_request:
    paths:
      - "api/**"
      - "supabase/**"
      - "tests/**"
      - ".github/workflows/api-tests.yml"
permissions:
  contents: read
jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: node --check app.js
      - run: node --check learning-paths.js
      - run: node --check api/capacity.js
      - run: node --check api/demand.js
      - run: node --check api/ambulances.js
      - run: node --check api/resources.js
      - run: node --test tests/*.test.cjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: node tests/browser-smoke.cjs

  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: capacity_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d capacity_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate token lifecycle and transactional capacity history on isolated Postgres
        env:
          PGPASSWORD: ci-only-password
        run: psql -h localhost -U postgres -d capacity_test -v ON_ERROR_STOP=1 -f tests/capacity-lifecycle.sql
