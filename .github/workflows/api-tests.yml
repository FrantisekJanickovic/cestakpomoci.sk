name: API regression tests
on:
  push:
    branches:
      - feature/guided-journey-mvp
  pull_request:
    paths:
      - "api/**"
      - "tests/**"
      - ".github/workflows/api-tests.yml"
permissions:
  contents: read
jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: node --check app.js
      - run: node --check learning-paths.js
      - run: node --check api/capacity.js
      - run: node --check api/demand.js
      - run: node --check api/ambulances.js
      - run: node --check api/resources.js
      - run: node --test tests/*.test.cjs
